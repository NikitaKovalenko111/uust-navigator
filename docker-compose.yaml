version: "3.8"
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.3
    container_name: es-local
    environment:
      - node.name=es-local
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # For quick local dev you can disable security, but it's not recommended for networked machines.
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - esnet

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.3
    container_name: kibana-local
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # If ES security is enabled, set credentials here:
      # - ELASTICSEARCH_USERNAME=elastic
      # - ELASTICSEARCH_PASSWORD=changeme
    ports:
      - "5601:5601"
    networks:
      - esnet

  api:
    container_name: server-api
    depends_on:
      - elasticsearch
    ports:
      - "3001:3001"
    build: 
      context: ./server
      dockerfile: Dockerfile

volumes:
  esdata:
    driver: local

networks:
  esnet:
    driver: bridge